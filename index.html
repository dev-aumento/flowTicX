<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/aaso-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/aaso-favicon.png" />
    <meta name="theme-color" content="#0EA5E9" />
    <title>Aaso</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("aumentox-theme");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
